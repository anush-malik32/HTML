<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Visual (With Arrows)</title>

<style>
    body {
        font-family: Arial;
        text-align: center;
        margin-top: 40px;
    }

    #container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
    }

    .box {
        width: 50px;
        height: 50px;
        margin: 5px;
        line-height: 50px;
        background-color: lightblue;
        font-weight: bold;
        border-radius: 5px;
        transition: 0.3s;
    }

    .active {
        background-color: orange;
    }

    .swap {
        background-color: red;
        color: white;
    }

    .arrow {
        font-size: 30px;
        margin: 0 5px;
        opacity: 0;
        transition: 0.3s;
    }

    .show {
        opacity: 1;
    }

    #log {
        margin-top: 20px;
        font-size: 18px;
    }

    #pass {
        font-size: 22px;
        margin-top: 15px;
        font-weight: bold;
    }

    button {
        margin: 10px;
        padding: 10px;
        cursor: pointer;
    }
</style>
</head>

<body>

<h2>Sorting Visualization (With Arrows)</h2>

<button onclick="start(true)">Ascending</button>
<button onclick="start(false)">Descending</button>

<div id="pass"></div>
<div id="container"></div>
<div id="log"></div>

<script>
let original = [40, 100, 1, 5, 25, 10];
let delay = 1200; // ⬅️ SLOWER

function render(arr, i=-1, j=-1, swap=false) {
    let container = document.getElementById("container");
    container.innerHTML = "";

    for (let index = 0; index < arr.length; index++) {

        let div = document.createElement("div");
        div.classList.add("box");
        div.innerText = arr[index];

        if (index === i || index === j) {
            div.classList.add(swap ? "swap" : "active");
        }

        container.appendChild(div);

        // ➡️ Add arrow between compared elements
        if (index === i && j === i + 1) {
            let arrow = document.createElement("div");
            arrow.innerText = "→";
            arrow.classList.add("arrow", "show");
            container.appendChild(arrow);
        }
    }
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function start(isAscending) {
    let arr = [...original];
    render(arr);

    let compare = isAscending 
        ? (a,b) => a - b 
        : (a,b) => b - a;

    for (let pass = 0; pass < arr.length - 1; pass++) {

        document.getElementById("pass").innerText = "Pass " + (pass + 1);

        for (let i = 0; i < arr.length - pass - 1; i++) {

            let a = arr[i];
            let b = arr[i + 1];
            let result = compare(a, b);

            render(arr, i, i+1);

            document.getElementById("log").innerHTML =
                `Comparing ${a} and ${b}<br>
                 ${isAscending ? "a - b" : "b - a"} = ${result}`;

            await sleep(delay);

            if (result > 0) {
                render(arr, i, i+1, true);
                await sleep(delay);

                let temp = arr[i];
                arr[i] = arr[i + 1];
                arr[i + 1] = temp;

                render(arr, i, i+1);
                await sleep(delay);
            }
        }
    }

    document.getElementById("pass").innerText = "Finished!";
    document.getElementById("log").innerText = "Array fully sorted.";
    render(arr);
}

render(original);
</script>

</body>
</html>
