<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>The JavaScript String() Method</h2>
    <p>The String() method can convert a number to a string.</p>
    <p id="number_result"></p>
    <p id="string_result"></p>
    <p id="anush1"></p>
    <p id="anush2"></p>
    <script>
        var x = 70;
        var y = 90;
        var z = x + y;
        document.getElementById("number_result").innerHTML = x + y;
        document.getElementById("string_result").innerHTML = String(x) + String(y);
        document.getElementById("anush1").innerHTML = x - y;
        document.getElementById("anush2").innerHTML = String(y) + String(z);
    </script>
</body>
</html>
