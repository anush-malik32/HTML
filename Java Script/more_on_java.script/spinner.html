<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Creepy Spinner Probability Lab</title>
<style>
body{margin:0;background:#05060b;color:white;font-family:Arial,sans-serif;text-align:center}
h1{color:#d9c6ff}
.card{max-width:1200px;margin:20px auto;padding:20px;background:rgba(255,255,255,.05);border-radius:20px}
#wheel{border-radius:50%;cursor:pointer}
button,input{padding:10px;margin:5px}
canvas{max-width:100%;background:#000;border-radius:10px}
.warning{opacity:.25}
</style>
</head>
<body>
<h1>🎡 Creepy Spinner Probability Lab</h1>
<div class="warning">THE SPINNER IS WATCHING • SPIN IF YOU DARE • THE AVERAGES KNOW</div>

<div class="card">
<canvas id="wheel" width="500" height="500"></canvas><br>
<button onclick="spin()">SPIN</button>
<p id="result">Click spin...</p>
</div>

<div class="card">
<h2>Probability Table</h2>
<table border="1" width="100%" id="table"></table>
</div>

<div class="card">
<h2>Central Limit Theorem Demo</h2>
<button onclick="runCLT(100)">100 Samples</button>
<button onclick="runCLT(1000)">1000 Samples</button>
<canvas id="hist" width="900" height="350"></canvas>
</div>

<script>
const sections=[
["👁️","WATCHING",1],["👹","FOLLOWING",2],["💀","WHISPERING",3],["🕷️","CRAWLING",4],
["🌑","WAITING",5],["👻","HIDING",6],["🐉","HUNGRY",7],["☠️","BEHIND YOU",8]
];
let counts=new Array(8).fill(0),total=0,angle=0;

const wheel=document.getElementById("wheel"),ctx=wheel.getContext("2d");

function drawWheel(rot=0){
ctx.clearRect(0,0,500,500);
for(let i=0;i<8;i++){
let s=i*Math.PI/4+rot,e=s+Math.PI/4;
ctx.beginPath();ctx.moveTo(250,250);
ctx.arc(250,250,220,s,e);ctx.closePath();
ctx.fillStyle=`hsl(${i*45},90%,40%)`;ctx.fill();
ctx.save();ctx.translate(250,250);ctx.rotate(s+Math.PI/8);
ctx.fillStyle="white";ctx.font="18px Arial";
ctx.fillText(sections[i][0],120,0);
ctx.restore();
}
ctx.fillStyle="white";
ctx.beginPath();ctx.moveTo(250,10);ctx.lineTo(230,50);ctx.lineTo(270,50);ctx.fill();
}
drawWheel();

function spin(){
let target=angle+Math.PI*2*(5+Math.random()*4);
let start=performance.now();
function animate(t){
let p=Math.min((t-start)/2500,1);
let e=1-Math.pow(1-p,3);
let a=angle+(target-angle)*e;
drawWheel(a);
if(p<1) requestAnimationFrame(animate);
else{
angle=target%(Math.PI*2);
finishSpin();
}
}
requestAnimationFrame(animate);
}

function finishSpin(){
let idx=Math.floor((((Math.PI*1.5-angle+Math.PI*2)%(Math.PI*2))/(Math.PI/4)))%8;
counts[idx]++; total++;
document.getElementById("result").innerHTML=sections[idx][0]+" "+sections[idx][1];
updateTable();
}

function updateTable(){
let html="<tr><th>Section</th><th>Count</th><th>Theoretical</th><th>Experimental</th></tr>";
for(let i=0;i<8;i++){
let exp=total?((counts[i]/total)*100).toFixed(2):0;
html+=`<tr><td>${sections[i][0]} ${sections[i][1]}</td><td>${counts[i]}</td><td>12.5%</td><td>${exp}%</td></tr>`;
}
document.getElementById("table").innerHTML=html;
}

function runCLT(samples){
let means=[];
for(let s=0;s<samples;s++){
let sum=0;
for(let i=0;i<30;i++) sum+=1+Math.floor(Math.random()*8);
means.push(sum/30);
}
drawHistogram(means);
}

function drawHistogram(data){
const c=document.getElementById("hist"),x=c.getContext("2d");
x.clearRect(0,0,c.width,c.height);
let bins=20,min=Math.min(...data),max=Math.max(...data);
let counts=new Array(bins).fill(0);
data.forEach(v=>{
let b=Math.min(bins-1,Math.floor((v-min)/(max-min||1)*bins));
counts[b]++;
});
let m=Math.max(...counts);
counts.forEach((v,i)=>{
let h=(v/m)*280;
x.fillStyle="cyan";
x.fillRect(i*(c.width/bins),320-h,(c.width/bins)-2,h);
});
x.fillStyle="white";
x.fillText("Bell curve emerges as samples increase (Central Limit Theorem)",20,20);
}
updateTable();
</script>
</body>
</html>
