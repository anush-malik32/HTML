<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dice Probability Lab</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #020617);
        color: white;
        text-align: center;
        margin: 0;
        padding: 20px;
    }

    h1 {
        margin-bottom: 5px;
    }

    .panel {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 12px;
        padding: 20px;
        margin: 20px auto;
        width: 85%;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    input[type=range] {
        width: 70%;
    }

    button {
        margin-top: 10px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #38bdf8;
        font-weight: bold;
    }

    button:hover {
        background: #0ea5e9;
    }

    .stats {
        margin-top: 10px;
        font-size: 16px;
        line-height: 1.6;
    }

    canvas {
        margin-top: 20px;
        background: white;
        border-radius: 10px;
        padding: 10px;
    }

    .big-number {
        font-size: 18px;
        font-weight: bold;
        color: #38bdf8;
    }
</style>
</head>

<body>

<h1>🎲 Dice Probability Lab</h1>
<p>Explore probability by simulating dice rolls</p>

<div class="panel">
    <p>Number of Experiments: <span id="value">10</span></p>
    <input type="range" min="10" max="10000" value="10" id="slider">
    <br>
    <button onclick="runSimulation()">Run Simulation</button>

    <div class="stats" id="stats"></div>
</div>

<div class="panel">
    <canvas id="chart"></canvas>
</div>

<script>
let slider = document.getElementById("slider");
let value = document.getElementById("value");
let statsBox = document.getElementById("stats");
let chart;

slider.oninput = () => {
    value.innerText = slider.value;
};

function runSimulation() {
    let n = parseInt(slider.value);
    let rolls = [];

    // Roll dice
    for (let i = 0; i < n; i++) {
        rolls.push(Math.floor(Math.random() * 6) + 1);
    }

    // Frequency count
    let freq = [0,0,0,0,0,0];
    rolls.forEach(r => freq[r-1]++);

    // Mean
    let sum = rolls.reduce((a,b) => a + b, 0);
    let mean = sum / n;

    // Std deviation
    let variance = rolls.reduce((a,b) => a + Math.pow(b - mean, 2), 0) / n;
    let std = Math.sqrt(variance);

    let min = Math.min(...rolls);
    let max = Math.max(...rolls);

    // Show stats
    statsBox.innerHTML = `
        <div class="big-number">Results for ${n} rolls</div>
        🎯 Mean: ${mean.toFixed(3)} <br>
        📊 Standard Deviation: ${std.toFixed(3)} <br>
        🔽 Min: ${min} | 🔼 Max: ${max} <br>
        🎲 Expected Mean (theory): 3.5
    `;

    drawChart(freq);
}

function drawChart(freq) {
    let ctx = document.getElementById("chart").getContext("2d");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "bar",
        data: {
            labels: ["1","2","3","4","5","6"],
            datasets: [{
                label: "Dice Frequency",
                data: freq,
                backgroundColor: "#38bdf8"
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: "Number of Times Rolled"
                    }
                },
                x: {
                    title: {
                        display: true,
                        text: "Dice Faces"
                    }
                }
            }
        }
    });
}
</script>

</body>
</html>
