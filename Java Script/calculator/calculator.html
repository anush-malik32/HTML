<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .buttons{
            display: grid;
            grid-template-columns: repeat(4,60px);
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="buttons">
        <button>+</button>
        <button>-</button>
        <button>×</button>
        <button>÷</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>0</button>
        <button>√</button>
        <button>x²</button>
        <button>c</button>
        <button>del</button>
        <button>%</button>
        <button>.</button>
    </div>
</body>
</html>
