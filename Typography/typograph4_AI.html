<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Universe</title>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<style>
/* ===== GLOBAL RESET ===== */
body {
    margin: 0;
    overflow-x: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    background: black;
}

/* ===== CANVAS BACKGROUND (PARTICLES) ===== */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* ===== HERO SECTION ===== */
.hero {
    text-align: center;
    padding: 100px 20px;
}

/* Neon glow text */
.glow {
    font-size: 3rem;
    color: #fff;
    text-shadow: 0 0 10px cyan, 0 0 20px cyan, 0 0 40px blue;
}

/* ===== FLOATING CHARACTER ===== */
#character {
    position: fixed;
    font-size: 60px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: float 4s ease-in-out infinite;
    cursor: pointer;
}

/* Floating animation */
@keyframes float {
    0% { transform: translate(-50%, -50%) translateY(0px); }
    50% { transform: translate(-50%, -50%) translateY(-20px); }
    100% { transform: translate(-50%, -50%) translateY(0px); }
}

/* ===== INTERACTIVE BOX ===== */
.interactive-box {
    margin: 40px auto;
    padding: 30px;
    width: 300px;
    text-align: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    transition: 0.4s;
}

/* Hover glow explosion */
.interactive-box:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px gold, 0 0 60px orange;
}

/* ===== IMAGE STYLE ===== */
.cool-img {
    width: 100%;
    border-radius: 15px;
    transition: 0.5s;
}

/* Image zoom + rotate */
.cool-img:hover {
    transform: scale(1.1) rotate(2deg);
}

/* ===== CLICK EFFECT ===== */
.explosion {
    position: absolute;
    width: 20px;
    height: 20px;
    background: radial-gradient(circle, yellow, red);
    border-radius: 50%;
    pointer-events: none;
    animation: explode 0.6s ease-out forwards;
}

@keyframes explode {
    to {
        transform: scale(6);
        opacity: 0;
    }
}

</style>
</head>

<body>

<!-- ===== PARTICLE CANVAS ===== -->
<canvas id="bg"></canvas>

<div class="hero">
    <h1 class="glow">🚀 Coding Universe</h1>
    <p>Click, hover, and explore the interactive world</p>
</div>

<!-- ===== FLOATING CHARACTER ===== -->
<div id="character">🧑‍🚀</div>

<!-- ===== INTERACTIVE CONTENT ===== -->
<div class="container text-center">

    <div class="interactive-box" onclick="spawnExplosion(event)">
        <h3>💥 Click Me</h3>
        <p>Creates an explosion effect</p>
    </div>

    <div class="interactive-box">
        <h3>🖼 Hover Image</h3>
        <!-- Cool image -->
        <img class="cool-img" src="https://picsum.photos/400/250">
    </div>

    <div class="interactive-box" onmouseover="randomColor(this)">
        <h3>🎨 Hover Me</h3>
        <p>Changes color dynamically</p>
    </div>

</div>

<script>
/* ===============================
   PARTICLE BACKGROUND SYSTEM
   =============================== */

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Create particles
let particles = [];

for (let i = 0; i < 100; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 1
    });
}

// Animate particles
function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";

    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        p.y += p.speed;

        // Reset particle to top
        if (p.y > canvas.height) {
            p.y = 0;
            p.x = Math.random() * canvas.width;
        }
    });

    requestAnimationFrame(animateParticles);
}

animateParticles();

/* ===============================
   CLICK EXPLOSION EFFECT
   =============================== */
function spawnExplosion(event) {
    const explosion = document.createElement("div");
    explosion.classList.add("explosion");

    explosion.style.left = event.clientX + "px";
    explosion.style.top = event.clientY + "px";

    document.body.appendChild(explosion);

    setTimeout(() => explosion.remove(), 600);
}

/* ===============================
   RANDOM COLOR HOVER
   =============================== */
function randomColor(el) {
    const colors = ["#ff4d4d", "#00ffff", "#ffcc00", "#66ff66"];
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
}

/* ===============================
   FLOATING CHARACTER INTERACTION
   =============================== */
const character = document.getElementById("character");

// Move character randomly every few seconds
setInterval(() => {
    character.style.top = Math.random() * 80 + "%";
    character.style.left = Math.random() * 80 + "%";
}, 3000);

// Click character = surprise
character.addEventListener("click", () => {
    alert("👽 You found the space explorer!");
});

/* ===============================
   RESPONSIVE CANVAS
   =============================== */
window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
