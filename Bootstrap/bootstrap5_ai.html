<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Container WOW++</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    /* HERO */
    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .glow {
      font-size: 4rem;
      font-weight: bold;
      animation: glowPulse 2s infinite alternate;
    }

    @keyframes glowPulse {
      from { text-shadow: 0 0 10px cyan; }
      to { text-shadow: 0 0 40px cyan, 0 0 80px cyan; }
    }

    /* FLOATING PARTICLES */
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-100vh); opacity: 0; }
    }

    /* CARDS */
    .card-hover:hover {
      transform: scale(1.08) rotate(1deg);
      transition: 0.4s;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    }

    /* PARALLAX */
    .parallax {
      background-image: url('https://picsum.photos/1920/1080');
      background-attachment: fixed;
      background-size: cover;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
    }

    /* BUTTON STYLE */
    .btn-glow {
      background: linear-gradient(45deg, cyan, purple);
      border: none;
      color: white;
      font-weight: bold;
      box-shadow: 0 0 15px cyan;
      transition: 0.3s;
    }

    .btn-glow:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px cyan;
    }

    /* CLICK RIPPLE */
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: rippleEffect 0.6s linear;
      background: rgba(255,255,255,0.6);
    }

    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

  </style>
</head>
<body>

<!-- HERO -->
<div class="container-fluid hero" id="hero">
  <div>
    <div class="glow">🚀 Container Power</div>
    <p>Interactive. Animated. Alive.</p>
    <button class="btn btn-glow mt-3" onclick="scrollToSection()">Explore ↓</button>
  </div>
</div>

<!-- STANDARD CONTAINER -->
<div class="container my-5" id="main">
  <h2 class="text-center mb-4">Interactive Cards</h2>
  <div class="row g-4">

    <div class="col-md-4">
      <div class="card card-hover bg-dark text-white text-center p-3">
        <h5>🌐 Visit Google</h5>
        <button class="btn btn-glow" onclick="goTo('https://www.google.com')">Go</button>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card card-hover bg-primary text-white text-center p-3">
        <h5>🎬 Watch YouTube</h5>
        <button class="btn btn-glow" onclick="goTo('https://www.youtube.com')">Go</button>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card card-hover bg-success text-white text-center p-3">
        <h5>💻 GitHub</h5>
        <button class="btn btn-glow" onclick="goTo('https://github.com')">Go</button>
      </div>
    </div>

  </div>
</div>

<!-- FULL WIDTH -->
<div class="container-fluid bg-warning text-dark py-5 text-center">
  <h2>Full Width Energy ⚡</h2>
  <button class="btn btn-dark" onclick="changeBackground()">Change Background</button>
</div>

<!-- PARALLAX -->
<div class="container-fluid parallax">
  <h1 class="glass">🔥 Cinematic Feel</h1>
</div>

<!-- GAME GRID -->
<div class="container my-5 text-center">
  <h2>Click the Boxes 🎮</h2>
  <div class="row">
    <div class="col-3"><div class="p-4 bg-danger" onclick="score()">💥</div></div>
    <div class="col-3"><div class="p-4 bg-info" onclick="score()">⚡</div></div>
    <div class="col-3"><div class="p-4 bg-success" onclick="score()">🌿</div></div>
    <div class="col-3"><div class="p-4 bg-dark" onclick="score()">🌌</div></div>
  </div>
  <h4 class="mt-3">Score: <span id="score">0</span></h4>
</div>

<!-- FOOTER -->
<div class="container text-center my-5">
  <h3>✨ Next-Level Bootstrap ✨</h3>
</div>

<script>

// ==============================
// JAVASCRIPT SECTION STARTS HERE
// ==============================

// Smooth scroll button
function scrollToSection() {
  document.getElementById('main').scrollIntoView({ behavior: 'smooth' });
}

// Redirect buttons
function goTo(url) {
  window.open(url, '_blank');
}

// Background changer
function changeBackground() {
  document.body.style.background = `linear-gradient(${Math.random()*360}deg, purple, cyan)`;
}

// Click game score system
let count = 0;
function score() {
  count++;
  document.getElementById('score').innerText = count;
}

// Particle generator (cool animated effect)
function createParticles() {
  const hero = document.getElementById('hero');

  for (let i = 0; i < 50; i++) {
    const p = document.createElement('div');
    p.classList.add('particle');

    // random position
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';

    // random speed
    p.style.animationDuration = (Math.random() * 5 + 3) + 's';

    hero.appendChild(p);
  }
}

// Ripple click effect
document.addEventListener('click', function(e) {
  const ripple = document.createElement('span');
  ripple.classList.add('ripple');

  ripple.style.left = e.clientX + 'px';
  ripple.style.top = e.clientY + 'px';

  document.body.appendChild(ripple);

  setTimeout(() => ripple.remove(), 600);
});

// Initialize particles
createParticles();

// ==============================
// JAVASCRIPT SECTION ENDS HERE
// ==============================

</script>

</body>
</html>
