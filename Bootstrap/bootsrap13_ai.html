<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Quest Quiz Adventure</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin:0;
    background:#0b1d2a;
    color:white;
    font-family: monospace;
    overflow:hidden;
}

#game {
    width:100vw;
    height:100vh;
    position:relative;
    background: linear-gradient(#1c3b57,#0b1d2a);
}

.player {
    width:40px;
    height:40px;
    background:#00ffc8;
    position:absolute;
    border-radius:6px;
    box-shadow:0 0 10px #00ffc8;
}

.npc {
    width:40px;
    height:40px;
    background:#ffcc00;
    position:absolute;
    border-radius:6px;
}

.quest-box {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.8);
    padding:20px;
    border-radius:10px;
    display:none;
    width:80%;
}

.option {
    cursor:pointer;
    padding:8px;
    margin:5px 0;
    background:#222;
    border-radius:5px;
}

.option:hover {
    background:#00ffc8;
    color:black;
}

.progress {
    position:absolute;
    top:10px;
    left:10px;
    width:200px;
}

.spark {
    position:absolute;
    width:5px;
    height:5px;
    background:gold;
    animation:boom 0.8s forwards;
}

@keyframes boom {
    to { transform: translate(var(--x),var(--y)); opacity:0; }
}

</style>
</head>

<body>

<div id="game">
    <div class="player" id="player"></div>
    <div class="npc" id="npc1" style="top:200px;left:300px;"></div>
    <div class="npc" id="npc2" style="top:400px;left:600px;"></div>

    <div class="progress">
        <div class="progress-bar bg-success" id="progressBar" style="width:0%"></div>
    </div>

    <div id="questBox" class="quest-box text-center">
        <h4 id="question"></h4>
        <div id="options"></div>
    </div>
</div>

<script>
let player = document.getElementById("player");
let x=100, y=100;
let score=0;
let currentQuest=0;

const quests = [
    {q:"What does HTML stand for?", options:["Hyper Text Markup Language","Hot Mail","How To Make Lasagna"], a:0},
    {q:"Which tag makes a link?", options:["<a>","<link>","<href>"], a:0},
    {q:"CSS is used for?", options:["Styling","Database","Server"], a:0},
    {q:"JavaScript runs in?", options:["Browser","Fridge","Toaster"], a:0}
];

// Movement
window.addEventListener("keydown", e=>{
    if(e.key==="ArrowRight") x+=20;
    if(e.key==="ArrowLeft") x-=20;
    if(e.key==="ArrowUp") y-=20;
    if(e.key==="ArrowDown") y+=20;

    player.style.left = x+"px";
    player.style.top = y+"px";

    checkCollision();
});

function checkCollision(){
    let npcs = document.querySelectorAll(".npc");
    npcs.forEach(npc=>{
        let nx = npc.offsetLeft;
        let ny = npc.offsetTop;

        if(Math.abs(x-nx)<40 && Math.abs(y-ny)<40){
            startQuest();
        }
    });
}

function startQuest(){
    if(currentQuest>=quests.length) return;

    document.getElementById("questBox").style.display="block";
    let q = quests[currentQuest];
    document.getElementById("question").innerText = q.q;

    let html="";
    q.options.forEach((opt,i)=>{
        html+=`<div class='option' onclick='answer(${i})'>${opt}</div>`;
    });

    document.getElementById("options").innerHTML = html;
}

function answer(i){
    let correct = quests[currentQuest].a;

    if(i===correct){
        score++;
        explode();
    }

    currentQuest++;
    document.getElementById("questBox").style.display="none";
    updateProgress();
}

function updateProgress(){
    let percent = (currentQuest/quests.length)*100;
    document.getElementById("progressBar").style.width = percent+"%";
}

function explode(){
    for(let i=0;i<20;i++){
        let s = document.createElement("div");
        s.className="spark";
        s.style.left = x+"px";
        s.style.top = y+"px";
        s.style.setProperty('--x',(Math.random()*100-50)+'px');
        s.style.setProperty('--y',(Math.random()*100-50)+'px');
        document.body.appendChild(s);
        setTimeout(()=>s.remove(),800);
    }
}

</script>

</body>
</html>
